name: Bug report
description: Something on AdStation doesn't work
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: e.g. /tv, /store/content
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Fire TV Stick, Silk browser
